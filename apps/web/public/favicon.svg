<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">Roku Emulator logo</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <circle cx="64" cy="58" r="52" fill="url(#glow)"/>
  <!-- TV screen -->
  <rect x="22" y="28" width="84" height="58" rx="10" fill="#0b1220" stroke="url(#screen)" stroke-width="5"/>
  <!-- stand -->
  <path d="M50 100h28M64 86v14" stroke="url(#screen)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- remote D-pad -->
  <g fill="url(#screen)">
    <path d="M64 34l9 11h-18z"/>
    <path d="M64 80l9-11h-18z"/>
    <path d="M33 57l11-9v18z"/>
    <path d="M95 57l-11-9v18z"/>
  </g>
  <circle cx="64" cy="57" r="7.5" fill="#f8fafc"/>
</svg>
