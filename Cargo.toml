[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# rustup's rust-objcopy may lack libLLVM on macOS; skip the default debuginfo strip.
strip = false

[profile.release.package.brs-wasm]
opt-level = "s"
