[package]
name = "brs-core"
description = "BrightScript lexer, parser, compiler and resumable bytecode VM (host independent)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
cipher = "0.4"
ctr = "0.9"
ecb = "0.1"
fancy-regex = "0.14"
hmac = "0.12"
httpdate = "1"
md5_digest = { version = "0.10", package = "md-5" }
# Pure-Rust inflate for reading channel zips (works on wasm32 and native).
miniz_oxide = "0.8"
# Text shaping (kerning) for fonts shipped in channel packages.
rustybuzz = "0.20"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
url = "2.5"
